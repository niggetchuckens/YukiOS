# Calamares welcome configuration for YukiOS
---
showSupportUrl:         https://github.com/niggetchuckens/YukiOS
showKnownIssuesUrl:     https://github.com/niggetchuckens/YukiOS/issues
showReleaseNotesUrl:    https://github.com/niggetchuckens/YukiOS
showDonateUrl:          false

requirements:
    requiredStorage:    15.0
    requiredRam:        1.0
    internetCheckUrl:
        - https://archlinux.org
        - http://example.com

    check:
        - storage
        - ram
        - power
        - screen
    required:
        - storage
        - ram

geoip:
    style:    "none"
